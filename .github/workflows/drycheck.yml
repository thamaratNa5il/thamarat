name: drycheck
on: push
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npx -y wrangler@latest --version && npx -y wrangler@latest deploy --dry-run --outdir /tmp/out 2>&1 | tee /tmp/o.txt; grep -qi "ratelimit\|CHAT_LIMIT" /tmp/o.txt && ! grep -qi "unexpected\|error" /tmp/o.txt
