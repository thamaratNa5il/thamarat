<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e5f0dd">
<title>الصفحة مش موجودة · ثمرات</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--forest:#dcefd3;--grove:#cde6c1;--canopy:#b5d7a6;--leaf:#37935a;--frond:#2f7a4c;--ink:#0e2617;--muted:#4d6c57;--on-leaf:#fff}
@media (prefers-color-scheme:dark){:root{--forest:#0b2418;--grove:#113322;--canopy:#1b4a31;--leaf:#6fb57d;--frond:#2f7a4c;--ink:#f3f7ef;--muted:#a4bfa9;--on-leaf:#0b2418}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 16px;background:linear-gradient(160deg,var(--forest),var(--grove));color:var(--ink);font:17px/1.8 "Tajawal",Tahoma,sans-serif;text-align:center}
main{max-width:520px;display:grid;justify-items:center;gap:14px}
img{height:72px;width:auto;margin-bottom:10px}
.code{font:700 clamp(64px,16vw,110px)/1 "Alexandria",sans-serif;color:var(--leaf);letter-spacing:.02em}
h1{font:600 clamp(22px,4vw,30px)/1.4 "Alexandria",sans-serif;margin:0}
p{margin:0;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:600 15px "Tajawal",sans-serif;padding:12px 22px;border-radius:99px;background:var(--leaf);color:var(--on-leaf);transition:transform .2s,background .2s}
a.btn:hover{transform:translateY(-2px);background:var(--frond)}
a.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--leaf)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin-top:18px;font-size:14.5px}
.links a{color:var(--muted)}
.links a:hover{color:var(--ink)}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-green.png" alt="ثمرات Thamarat" id="logo">
  <div class="code" aria-hidden="true">404</div>
  <h1>الصفحة دي مش موجودة</h1>
  <p>يمكن اللينك اتكتب غلط أو الصفحة اتنقلت. ارجع للرئيسية أو كلّمنا على واتساب ونساعدك.</p>
  <div class="btns">
    <a class="btn" href="/">الرجوع للرئيسية</a>
    <a class="btn ghost" href="https://wa.me/201044002224" target="_blank" rel="noopener">كلّمنا على واتساب</a>
  </div>
  <nav class="links" aria-label="صفحات الموقع">
    <a href="/works">سابقة الأعمال</a><a href="/calc">دراسة الجدوى</a><a href="/faq">أسئلة شائعة</a><a href="/order">طلب شراء</a>
  </nav>
</main>
<script>if(matchMedia('(prefers-color-scheme: dark)').matches)document.getElementById('logo').src='/assets/logo-cream.png'</script>
</body>
</html>
